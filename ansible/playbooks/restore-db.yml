---
# ==========================================
# Playbook: Automated Database Restore (DR)
# ==========================================
- hosts: masters
  become: yes
  tasks:
    - name: Ensure AWS CLI and PostgreSQL client are installed
      apt:
        name:
          - awscli
          - postgresql-client
        state: present
        update_cache: yes

    - name: Fetch and verify latest backup from S3
      shell: |
        set -euo pipefail
        BUCKET="{{ backup_bucket | default('techshop-loki-790400775134') }}"
        LATEST_BACKUP=$(aws s3 ls "s3://${BUCKET}/" | sort | tail -n 1 | awk '{print $4}')
        if [ -z "$LATEST_BACKUP" ]; then
          echo "No backup archive found in s3://${BUCKET}/" >&2
          exit 1
        fi
        if ! echo "$LATEST_BACKUP" | grep -Eq '^backup-[0-9]{8}-[0-9]{6}\.sql\.gz$'; then
          echo "Refusing to restore: filename does not match expected pattern: $LATEST_BACKUP" >&2
          exit 1
        fi
        aws s3 cp "s3://${BUCKET}/${LATEST_BACKUP}" /tmp/latest_backup.sql.gz
        if aws s3 cp "s3://${BUCKET}/${LATEST_BACKUP}.sha256" /tmp/latest_backup.sql.gz.sha256 2>/dev/null; then
          cd /tmp && sha256sum -c latest_backup.sql.gz.sha256
        fi
        gzip -d -f /tmp/latest_backup.sql.gz
      register: s3_fetch

    - name: Restore database to new HA cluster
      shell: |
        psql -h "{{ pg_host | default('techshop-postgresql-ha-pgpool.techshop.svc.cluster.local') }}" \
             -U "{{ pg_user | default('postgres') }}" \
             -d "{{ pg_db | default('shopdb') }}" \
             -f /tmp/latest_backup.sql
      environment:
        PGPASSWORD: "{{ pg_password | default('change_me') }}"

    - name: Cleanup temporary files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/latest_backup.sql
        - /tmp/latest_backup.sql.gz
        - /tmp/latest_backup.sql.gz.sha256

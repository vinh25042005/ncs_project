# Ansible Inventory chạy trực tiếp từ pfSense Gateway (Không cần ProxyJump)
# Tự động sinh bởi Terraform

[gateway]
pfsense-gateway ansible_host=localhost ansible_connection=local

[master]
k8s-master ansible_host=10.0.10.10

[workers]
k8s-worker-1 ansible_host=10.0.10.71
k8s-worker-2 ansible_host=10.0.11.22

[k8s_cluster:children]
master
workers

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/ncs-key.pem
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

---
# Role: worker — Tham gia Worker node vào cụm Kubernetes (kubeadm join)
# ====================================================================

- name: Kiểm tra xem Worker node đã tham gia cụm chưa
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Thực thi lệnh join vào cụm Kubernetes
  shell: "{{ hostvars[groups['master'][0]]['k8s_join_command'] }}"
  when: not kubelet_conf.stat.exists

- name: Đảm bảo kubelet được kích hoạt và khởi chạy
  systemd:
    name: kubelet
    state: started
    enabled: yes

- name: Đợi Master xác nhận Worker node chuyển sang trạng thái Ready
  shell: |
    KUBECONFIG=/etc/kubernetes/admin.conf kubectl get nodes -o wide | grep "{{ ansible_host }}" | grep -w "Ready"
  delegate_to: "{{ groups['master'][0] }}"
  register: worker_ready
  until: worker_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false

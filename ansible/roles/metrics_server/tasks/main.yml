---
# Role: metrics_server — Tự động cài đặt và cấu hình Metrics-Server cho cụm K8s

- name: Kiểm tra Metrics-Server đã tồn tại trong cụm chưa
  ansible.builtin.shell: kubectl get deployment metrics-server -n kube-system
  register: metrics_server_check
  failed_when: false
  changed_when: false

- name: Cài đặt Metrics-Server từ manifests chính thức (ghim phiên bản v0.7.2)
  ansible.builtin.shell: |
    kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
  when: metrics_server_check.rc != 0

- name: Cấu hình tham số --kubelet-insecure-tls để Metrics-Server có thể đọc số liệu từ Kubelet
  ansible.builtin.shell: |
    if ! kubectl get deployment metrics-server -n kube-system -o yaml | grep -q -- '--kubelet-insecure-tls'; then
      kubectl patch deployment metrics-server -n kube-system \
        --type='json' -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]'
    fi
  changed_when: false

- name: Đợi Metrics-Server Deployment đạt trạng thái sẵn sàng 
  ansible.builtin.shell: |
    kubectl rollout status deployment/metrics-server -n kube-system --timeout=180s
  changed_when: false

- name: Đợi 15 giây để Metrics-Server hoàn thành chu kỳ thu thập dữ liệu (scrape) đầu tiên
  ansible.builtin.pause:
    seconds: 15

- name: Kiểm tra số liệu CPU/RAM của các Nodes (kubectl top nodes)
  ansible.builtin.shell: |
    kubectl top nodes
  register: top_nodes_output
  changed_when: false

- name: Hiển thị kết quả thu thập số liệu Nodes
  ansible.builtin.debug:
    var: top_nodes_output.stdout_lines

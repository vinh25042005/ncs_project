---
# Role: gateway — Suricata IDS/IPS biên + DNAT cổng quản trị
# gateway_suricata_ips=false -> PHÁT HIỆN (af-packet); =true -> CHẶN inline (NFQUEUE -q 0)
# Lưu ý: systemd unit gốc ghi cứng --af-packet, nên dùng drop-in override để đổi chế độ.
- name: Đợi và giải phóng tiến trình APT / cloud-init nếu đang chạy
  ansible.builtin.shell: |
    systemctl stop unattended-upgrades 2>/dev/null || true
    while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
      echo "Đang đợi tiến trình APT khác hoàn tất..."
      sleep 3
    done
    dpkg --configure -a
  changed_when: false
  ignore_errors: true

- name: Đảm bảo iptables-persistent, haproxy và socat được cài đặt
  ansible.builtin.apt:
    name:
      - iptables-persistent
      - haproxy
      - socat
    state: present
    update_cache: yes

- name: Nhận diện card mạng WAN
  ansible.builtin.shell: |
    WAN_DEV=$(ip -o -4 route show to default | awk '{print $5}' | head -n1)
    [ -z "$WAN_DEV" ] && WAN_DEV="ens5"
    echo "$WAN_DEV"
  register: detected_wan_dev
  changed_when: false

- name: disable.conf — tắt tất cả trước
  ansible.builtin.copy:
    src: disable.conf
    dest: /etc/suricata/disable.conf
    mode: "0644"

- name: enable.conf — bật nhóm quét & tấn công web
  ansible.builtin.copy:
    src: enable.conf
    dest: /etc/suricata/enable.conf
    mode: "0644"

- name: drop.conf — chuyển nhóm quét/web sang DROP (chỉ khi IPS)
  ansible.builtin.template:
    src: drop.conf.j2
    dest: /etc/suricata/drop.conf
    mode: "0644"

- name: Tải & biên dịch bộ luật ET Open (chỉ nhóm đã bật)
  ansible.builtin.command: suricata-update --no-test --no-reload
  changed_when: true

- name: Ghi luật tự viết local.rules
  ansible.builtin.template:
    src: local.rules.j2
    dest: /etc/suricata/rules/local.rules
    mode: "0644"

- name: Cấu hình rule-files + tắt checksum trong suricata.yaml
  ansible.builtin.shell: |
    python3 - <<'PYEOF'
    import re
    p = "/etc/suricata/suricata.yaml"
    c = open(p).read()
    c = re.sub(r"rule-files:\n(?:[ \t]*-[^\n]+\n)*",
               "rule-files:\n  - /var/lib/suricata/rules/suricata.rules\n  - /etc/suricata/rules/local.rules\n", c)
    c = re.sub(r"(\n\s*)checksum-validation:\s*\w+", r"\1checksum-validation: no", c)
    open(p, "w").write(c)
    PYEOF
  changed_when: true

- name: Thư mục systemd drop-in cho suricata
  ansible.builtin.file:
    path: /etc/systemd/system/suricata.service.d
    state: directory
    mode: "0755"

- name: Override ExecStart — af-packet (phát hiện) hoặc NFQUEUE -q 0 (chặn)
  ansible.builtin.template:
    src: suricata-override.conf.j2
    dest: /etc/systemd/system/suricata.service.d/override.conf
    mode: "0644"

- name: Nạp lại systemd và khởi động lại Suricata
  ansible.builtin.systemd:
    name: suricata
    state: restarted
    enabled: true
    daemon_reload: true

- name: Đợi Suricata ổn định
  ansible.builtin.pause:
    seconds: 5

- name: Xác nhận Suricata đang chạy
  ansible.builtin.command: systemctl is-active suricata
  register: suricata_status
  failed_when: suricata_status.stdout != "active"
  changed_when: false

- name: "IPS: đưa traffic chuyển tiếp qua NFQUEUE (fail-open)"
  ansible.builtin.shell: |
    iptables -C FORWARD -j NFQUEUE --queue-num 0 --queue-bypass 2>/dev/null \
      || iptables -I FORWARD 1 -j NFQUEUE --queue-num 0 --queue-bypass
    netfilter-persistent save
  when: gateway_suricata_ips | bool
  changed_when: true

- name: "IDS: gỡ NFQUEUE khỏi FORWARD (chế độ chỉ phát hiện)"
  ansible.builtin.shell: |
    while iptables -C FORWARD -j NFQUEUE --queue-num 0 --queue-bypass 2>/dev/null; do
      iptables -D FORWARD -j NFQUEUE --queue-num 0 --queue-bypass
    done
    netfilter-persistent save
  when: not (gateway_suricata_ips | bool)
  changed_when: true

- name: Nhận diện card mạng LAN
  ansible.builtin.shell: |
    WAN_DEV="{{ detected_wan_dev.stdout }}"
    LAN_DEV=$(ip -o link show | awk -F': ' '{print $2}' | grep -v lo | grep -v "$WAN_DEV" | head -n1)
    [ -z "$LAN_DEV" ] && LAN_DEV="ens6"
    echo "$LAN_DEV"
  register: detected_lan_dev
  changed_when: false

- name: Cấu hình HAProxy Layer 4 Reverse Proxy & Health Checking
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: "0644"

- name: Cấu hình IPTables (Cho phép HAProxy nhận 80/443/7443, DNAT 8443 Wazuh và Masquerade)
  ansible.builtin.shell: |
    WAN_DEV="{{ detected_wan_dev.stdout }}"
    LAN_DEV="{{ detected_lan_dev.stdout }}"

    # 1. PREROUTING: Dọn dẹp DNAT cũ cho 80, 443, 7443 để HAProxy tiếp nhận trực tiếp
    for r in $(iptables -t nat -L PREROUTING --line-numbers -n | grep -E "dpt:80|dpt:443|dpt:7443|dpt:8443" | awk '{print $1}' | tac); do
      iptables -t nat -D PREROUTING $r
    done
    # Chỉ giữ lại DNAT cổng 8443 chuyển tiếp sang máy chủ Wazuh SIEM
    iptables -t nat -A PREROUTING -i "$WAN_DEV" -p tcp --dport 8443 -j DNAT --to-destination {{ wazuh_server_ip }}:443

    # 2. INPUT: Cho phép traffic vào HAProxy (80, 443, 7443) và Stats (8404)
    iptables -C INPUT -p tcp -m multiport --dports 80,443,7443,8404 -j ACCEPT 2>/dev/null \
      || iptables -I INPUT 1 -p tcp -m multiport --dports 80,443,7443,8404 -j ACCEPT

    # 3. FORWARD: Cho phép traffic chuyển tiếp Wazuh và các kết nối nội bộ
    iptables -C FORWARD -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null \
      || iptables -A FORWARD -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
    iptables -C FORWARD -i "$LAN_DEV" -o "$WAN_DEV" -j ACCEPT 2>/dev/null \
      || iptables -A FORWARD -i "$LAN_DEV" -o "$WAN_DEV" -j ACCEPT

    for r in $(iptables -L FORWARD --line-numbers -n | grep -E "dpt:80|dpt:443|dpt:30443|dpt:55000|dpt:9443|dpt:7443|dpt:8443" | awk '{print $1}' | tac); do
      iptables -D FORWARD $r
    done
    iptables -A FORWARD -p tcp -d {{ wazuh_server_ip }} --dport 443 -j ACCEPT

    # 4. POSTROUTING: NAT Egress ra Internet (WAN) & LAN Masquerade
    iptables -t nat -C POSTROUTING -o "$WAN_DEV" -j MASQUERADE 2>/dev/null \
      || iptables -t nat -A POSTROUTING -o "$WAN_DEV" -j MASQUERADE

    iptables -t nat -C POSTROUTING -o "$LAN_DEV" -j MASQUERADE 2>/dev/null \
      || iptables -t nat -A POSTROUTING -o "$LAN_DEV" -j MASQUERADE

    for r in $(iptables -t nat -L POSTROUTING --line-numbers -n | grep -E "dpt:80|dpt:443|dpt:30443|dpt:55000|dpt:9443" | awk '{print $1}' | tac); do
      iptables -t nat -D POSTROUTING $r
    done

    netfilter-persistent save
  changed_when: true

- name: Kích hoạt và khởi động lại dịch vụ HAProxy
  ansible.builtin.systemd:
    name: haproxy
    state: restarted
    enabled: true
    daemon_reload: true

- name: Xác nhận HAProxy đang hoạt động bình thường
  ansible.builtin.command: systemctl is-active haproxy
  register: haproxy_status
  failed_when: haproxy_status.stdout != "active"
  changed_when: false

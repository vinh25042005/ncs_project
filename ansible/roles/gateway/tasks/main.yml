---
# Role: gateway — Suricata IDS/IPS biên + DNAT cổng quản trị
# gateway_suricata_ips=false -> PHÁT HIỆN (af-packet); =true -> CHẶN inline (NFQUEUE -q 0)
# Lưu ý: systemd unit gốc ghi cứng --af-packet, nên dùng drop-in override để đổi chế độ.
- name: Nhận diện card mạng WAN
  ansible.builtin.shell: |
    WAN_DEV=$(ip -o -4 route show to default | awk '{print $5}' | head -n1)
    [ -z "$WAN_DEV" ] && WAN_DEV="ens5"
    echo "$WAN_DEV"
  register: detected_wan_dev
  changed_when: false

- name: disable.conf — tắt tất cả trước
  ansible.builtin.copy:
    src: disable.conf
    dest: /etc/suricata/disable.conf
    mode: "0644"

- name: enable.conf — bật nhóm quét & tấn công web
  ansible.builtin.copy:
    src: enable.conf
    dest: /etc/suricata/enable.conf
    mode: "0644"

- name: drop.conf — chuyển nhóm quét/web sang DROP (chỉ khi IPS)
  ansible.builtin.template:
    src: drop.conf.j2
    dest: /etc/suricata/drop.conf
    mode: "0644"

- name: Tải & biên dịch bộ luật ET Open (chỉ nhóm đã bật)
  ansible.builtin.command: suricata-update --no-test --no-reload
  changed_when: true

- name: Ghi luật tự viết local.rules
  ansible.builtin.template:
    src: local.rules.j2
    dest: /etc/suricata/rules/local.rules
    mode: "0644"

- name: Cấu hình rule-files + tắt checksum trong suricata.yaml
  ansible.builtin.shell: |
    python3 - <<'PYEOF'
    import re
    p = "/etc/suricata/suricata.yaml"
    c = open(p).read()
    c = re.sub(r"rule-files:\n(?:[ \t]*-[^\n]+\n)*",
               "rule-files:\n  - /var/lib/suricata/rules/suricata.rules\n  - /etc/suricata/rules/local.rules\n", c)
    c = re.sub(r"(\n\s*)checksum-validation:\s*\w+", r"\1checksum-validation: no", c)
    open(p, "w").write(c)
    PYEOF
  changed_when: true

- name: Thư mục systemd drop-in cho suricata
  ansible.builtin.file:
    path: /etc/systemd/system/suricata.service.d
    state: directory
    mode: "0755"

- name: Override ExecStart — af-packet (phát hiện) hoặc NFQUEUE -q 0 (chặn)
  ansible.builtin.template:
    src: suricata-override.conf.j2
    dest: /etc/systemd/system/suricata.service.d/override.conf
    mode: "0644"

- name: Nạp lại systemd và khởi động lại Suricata
  ansible.builtin.systemd_service:
    name: suricata
    state: restarted
    enabled: true
    daemon_reload: true

- name: Đợi Suricata ổn định
  ansible.builtin.pause:
    seconds: 5

- name: Xác nhận Suricata đang chạy
  ansible.builtin.command: systemctl is-active suricata
  register: suricata_status
  failed_when: suricata_status.stdout != "active"
  changed_when: false

- name: "IPS: đưa traffic chuyển tiếp qua NFQUEUE (fail-open)"
  ansible.builtin.shell: |
    iptables -C FORWARD -j NFQUEUE --queue-num 0 --queue-bypass 2>/dev/null \
      || iptables -I FORWARD 1 -j NFQUEUE --queue-num 0 --queue-bypass
    netfilter-persistent save
  when: gateway_suricata_ips | bool
  changed_when: true

- name: "IDS: gỡ NFQUEUE khỏi FORWARD (chế độ chỉ phát hiện)"
  ansible.builtin.shell: |
    while iptables -C FORWARD -j NFQUEUE --queue-num 0 --queue-bypass 2>/dev/null; do
      iptables -D FORWARD -j NFQUEUE --queue-num 0 --queue-bypass
    done
    netfilter-persistent save
  when: not (gateway_suricata_ips | bool)
  changed_when: true

- name: DNAT 8443 -> Wazuh Dashboard (master:9443)
  ansible.builtin.shell: |
    WAN_DEV="{{ detected_wan_dev.stdout }}"
    iptables -t nat -C PREROUTING -i $WAN_DEV -p tcp --dport 8443 -j DNAT --to-destination 10.0.10.10:9443 2>/dev/null \
      || iptables -t nat -A PREROUTING -i $WAN_DEV -p tcp --dport 8443 -j DNAT --to-destination 10.0.10.10:9443
    iptables -t nat -C POSTROUTING -p tcp -d 10.0.10.10 --dport 9443 -j MASQUERADE 2>/dev/null \
      || iptables -t nat -A POSTROUTING -p tcp -d 10.0.10.10 --dport 9443 -j MASQUERADE
  changed_when: true

- name: DNAT 7443 -> K8s Dashboard/Rancher (master:30443)
  ansible.builtin.shell: |
    WAN_DEV="{{ detected_wan_dev.stdout }}"
    iptables -t nat -C PREROUTING -i $WAN_DEV -p tcp --dport 7443 -j DNAT --to-destination 10.0.10.10:30443 2>/dev/null \
      || iptables -t nat -A PREROUTING -i $WAN_DEV -p tcp --dport 7443 -j DNAT --to-destination 10.0.10.10:30443
    iptables -t nat -C POSTROUTING -p tcp -d 10.0.10.10 --dport 30443 -j MASQUERADE 2>/dev/null \
      || iptables -t nat -A POSTROUTING -p tcp -d 10.0.10.10 --dport 30443 -j MASQUERADE
  changed_when: true

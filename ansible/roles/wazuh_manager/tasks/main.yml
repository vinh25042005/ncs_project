---
# Role: wazuh_manager — Tự động cài đặt trọn bộ Wazuh All-in-One (Indexer + Manager + Dashboard + Filebeat)

- name: Đợi và giải phóng tiến trình APT / cloud-init nếu đang chạy
  ansible.builtin.shell: |
    systemctl stop unattended-upgrades 2>/dev/null || true
    while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
      echo "Đang đợi tiến trình APT khác hoàn tất..."
      sleep 3
    done
    dpkg --configure -a
  changed_when: false
  ignore_errors: true

- name: Dừng và giải phóng toàn bộ tiến trình Wazuh cũ 
  ansible.builtin.shell: |
    systemctl stop wazuh-manager wazuh-indexer filebeat wazuh-dashboard 2>/dev/null || true
    fuser -k 1515/tcp 55000/tcp 2>/dev/null || true
  changed_when: false

- name: Tải script cài đặt Wazuh All-in-One
  ansible.builtin.get_url:
    url: https://packages.wazuh.com/4.14/wazuh-install.sh
    dest: /root/wazuh-install.sh
    mode: '0755'

- name: Cài đặt Wazuh All-in-One (Indexer + Server + Dashboard)
  ansible.builtin.shell: |
    rm -f /root/wazuh-install-files.tar
    bash /root/wazuh-install.sh -a -o
  changed_when: true

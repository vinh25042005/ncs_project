---
# Role: ingress — Cài đặt Ingress-NGINX Controller cho Kubernetes Gốc (Baremetal HostNetwork)
# =========================================================================================

- name: Bỏ taint control-plane trên Master node để có thể chạy Ingress Controller
  shell: |
    KUBECONFIG=/etc/kubernetes/admin.conf kubectl taint nodes --all node-role.kubernetes.io/control-plane- 2>/dev/null || true
  changed_when: false

- name: Dọn dẹp Job admission webhook cũ nếu có (tránh lỗi immutable Job spec khi re-apply)
  ansible.builtin.shell: |
    KUBECONFIG=/etc/kubernetes/admin.conf kubectl delete job -n ingress-nginx --all --ignore-not-found=true
  changed_when: false

- name: Cài đặt Ingress-NGINX Bare-metal Manifests
  ansible.builtin.shell: |
    KUBECONFIG=/etc/kubernetes/admin.conf kubectl apply -f {{ ingress_nginx_manifest_url }}
  changed_when: false

- name: Cấu hình Ingress-NGINX sử dụng HostNetwork để lắng nghe trực tiếp trên cổng 80 & 443
  shell: |
    KUBECONFIG=/etc/kubernetes/admin.conf kubectl patch deployment ingress-nginx-controller -n ingress-nginx \
      -p '{"spec": {"template": {"spec": {"hostNetwork": true, "nodeSelector": {"node-role.kubernetes.io/control-plane": ""}}}}}'
  changed_when: false

- name: Đánh dấu IngressClass nginx là Ingress Class mặc định
  shell: |
    KUBECONFIG=/etc/kubernetes/admin.conf kubectl annotate ingressclass nginx ingressclass.kubernetes.io/is-default-class="true" --overwrite
  changed_when: false

- name: Đợi Ingress-NGINX Controller Deployment đạt trạng thái sẵn sàng (Rolled Out)
  shell: |
    KUBECONFIG=/etc/kubernetes/admin.conf kubectl rollout status deployment/ingress-nginx-controller -n ingress-nginx --timeout=180s
  changed_when: false

---
# Role: ingress — Cài đặt Ingress-NGINX Controller cho Kubernetes 
- name: Đảm bảo Master node giữ nguyên taint control-plane (Bảo vệ Control Plane)
  ansible.builtin.shell: |
    kubectl taint nodes --selector='node-role.kubernetes.io/control-plane' node-role.kubernetes.io/control-plane:NoSchedule --overwrite 2>/dev/null || true
  changed_when: false

- name: Dọn dẹp Job admission webhook cũ nếu có (tránh lỗi immutable Job spec khi re-apply)
  ansible.builtin.shell: |
    kubectl delete job -n ingress-nginx --all --ignore-not-found=true
  changed_when: false

- name: Cài đặt Ingress-NGINX 
  ansible.builtin.shell: |
    kubectl apply -f {{ ingress_nginx_manifest_url }}
  changed_when: false

- name: Gán nhãn ingress-ready cho cả 2 Worker Nodes (Multi-AZ HA)
  ansible.builtin.shell: |
    kubectl label node ip-10-0-10-139 ingress-ready=true --overwrite
    kubectl label node ip-10-0-11-21 ingress-ready=true --overwrite
  changed_when: false

- name: Cấu hình Ingress-NGINX chạy trên cả 2 Worker nodes (Replicas=2) với HostNetwork
  ansible.builtin.shell: |
    kubectl patch deployment ingress-nginx-controller -n ingress-nginx \
      --type=json \
      -p='[{"op": "replace", "path": "/spec/template/spec/nodeSelector", "value": {"ingress-ready": "true", "kubernetes.io/os": "linux"}}, {"op": "replace", "path": "/spec/template/spec/tolerations", "value": []}, {"op": "replace", "path": "/spec/template/spec/hostNetwork", "value": true}]'
    kubectl scale deployment ingress-nginx-controller -n ingress-nginx --replicas=2
  changed_when: false

- name: Đánh dấu IngressClass nginx là Ingress Class mặc định
  ansible.builtin.shell: |
    kubectl annotate ingressclass nginx ingressclass.kubernetes.io/is-default-class="true" --overwrite
  changed_when: false

- name: Tạo namespace online-boutique trước nếu chưa tồn tại (để tạo TLS Secret)
  ansible.builtin.shell: |
    kubectl create namespace online-boutique --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

- name: Tạo chứng chỉ SSL tự ký chuẩn và Secret boutique-tls cho domain boutique.lab
  ansible.builtin.shell: |
    mkdir -p /tmp/boutique-certs
    if [ ! -f /tmp/boutique-certs/tls.key ]; then
      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
        -keyout /tmp/boutique-certs/tls.key \
        -out /tmp/boutique-certs/tls.crt \
        -subj "/CN=boutique.lab/O=NCS Project"
    fi
    kubectl create secret tls boutique-tls \
      --cert=/tmp/boutique-certs/tls.crt \
      --key=/tmp/boutique-certs/tls.key \
      -n online-boutique --dry-run=client -o yaml | kubectl apply -f -
    rm -rf /tmp/boutique-certs
  changed_when: false

- name: Đợi Ingress-NGINX Controller Deployment đạt trạng thái sẵn sàng (Rolled Out)
  ansible.builtin.shell: |
    kubectl rollout status deployment/ingress-nginx-controller -n ingress-nginx --timeout=180s
  changed_when: false

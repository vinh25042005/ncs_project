apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps"]
  - level: Request
    resources:
      - group: ""
        resources: ["pods/exec"]
  - level: RequestResponse
    resources:
      - group: ""
        resources: ["pods"]
  - level: Metadata

---
# Role: master — Khởi tạo cụm Kubernetes Control-Plane (kubeadm init)
- name: Kiểm tra xem cụm đã được khởi tạo trước đó chưa
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadmin_conf

- name: Tạo thư mục cấu hình và audit log
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/kubernetes
    - /var/log/kubernetes

- name: Tạo file audit-policy.yaml cho K8s API Server
  ansible.builtin.copy:
    src: audit-policy.yaml
    dest: /etc/kubernetes/audit-policy.yaml
    mode: '0644'

- name: Tạo cấu hình kubeadm-config.yaml
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    mode: '0644'
  when: not kubeadmin_conf.stat.exists

- name: Khởi tạo Kubernetes Control-Plane
  ansible.builtin.shell: |
    kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
  when: not kubeadmin_conf.stat.exists

- name: Cấu hình thư mục .kube cho user ubuntu và root
  ansible.builtin.shell: |
    mkdir -p /home/ubuntu/.kube /root/.kube
    cp -f /etc/kubernetes/admin.conf /home/ubuntu/.kube/config
    cp -f /etc/kubernetes/admin.conf /root/.kube/config
    chmod 600 /home/ubuntu/.kube/config /root/.kube/config
    chown -R ubuntu:ubuntu /home/ubuntu/.kube
  changed_when: false

- name: Thiết lập biến môi trường KUBECONFIG hệ thống trong /etc/environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    line: "KUBECONFIG={{ kubeconfig | default('/etc/kubernetes/admin.conf') }}"
    state: present

- name: Kiểm tra manifest kube-apiserver (static pod)
  ansible.builtin.stat:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
  register: apiserver_manifest
  tags: [audit]

- name: Giới hạn audit log trên kube-apiserver
  ansible.builtin.lineinfile:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
    regexp: '^\s*- --{{ item.flag }}='
    insertafter: '^\s*- --audit-log-path='
    line: "    - --{{ item.flag }}={{ item.value }}"
  loop:
    - { flag: audit-log-maxsize, value: "{{ audit_log_maxsize }}" }
    - { flag: audit-log-maxbackup, value: "{{ audit_log_maxbackup }}" }
    - { flag: audit-log-maxage, value: "{{ audit_log_maxage }}" }
  register: audit_flags
  when: apiserver_manifest.stat.exists
  tags: [audit]

- name: Chờ kubelet khởi động lại kube-apiserver với cấu hình audit mới
  ansible.builtin.pause:
    seconds: 30
  when: audit_flags is changed
  tags: [audit]

- name: Đợi kube-apiserver sẵn sàng trở lại
  ansible.builtin.shell: |
    kubectl get --raw=/readyz
  register: apiserver_ready
  until: apiserver_ready.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  when: audit_flags is changed
  tags: [audit]

- name: Tạo lệnh join token mới cho Worker nodes
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_cmd_raw
  changed_when: false

- name: Lưu lệnh join vào hostvars cho các Worker nodes sử dụng
  ansible.builtin.set_fact:
    k8s_join_command: "{{ join_cmd_raw.stdout }}"

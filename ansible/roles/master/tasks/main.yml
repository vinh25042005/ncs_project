---
# Role: master — Khởi tạo cụm Kubernetes Gốc (kubeadm init) + Flannel CNI
# ======================================================================

- name: Kiểm tra xem cụm đã được khởi tạo trước đó chưa
  stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadmin_conf

- name: Tạo cấu hình kubeadm-config.yaml
  copy:
    dest: /etc/kubernetes/kubeadm-config.yaml
    content: |
      apiVersion: kubeadm.k8s.io/v1beta3
      kind: InitConfiguration
      localAPIEndpoint:
        advertiseAddress: "{{ master_ip }}"
        bindPort: 6443
      nodeRegistration:
        criSocket: "unix:///var/run/containerd/containerd.sock"
        kubeletExtraArgs:
          fail-swap-on: "false"
      ---
      apiVersion: kubeadm.k8s.io/v1beta3
      kind: ClusterConfiguration
      networking:
        podSubnet: "{{ pod_network_cidr }}"
      apiServer:
        extraArgs:
          audit-log-path: "/var/log/kubernetes/audit.log"
          audit-policy-file: "/etc/kubernetes/audit-policy.yaml"
      ---
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      failSwapOn: false
  when: not kubeadmin_conf.stat.exists

- name: Tạo file audit-policy.yaml cho K8s API Server (phục vụ Wazuh SIEM)
  copy:
    dest: /etc/kubernetes/audit-policy.yaml
    content: |
      apiVersion: audit.k8s.io/v1
      kind: Policy
      rules:
        - level: Metadata
          resources:
            - group: ""
              resources: ["secrets", "configmaps"]
        - level: RequestResponse
          resources:
            - group: ""
              resources: ["pods", "pods/exec"]
        - level: Metadata

- name: Khởi tạo Kubernetes Control-Plane với kubeadm
  shell: |
    kubeadm init --config /etc/kubernetes/kubeadm-config.yaml --ignore-preflight-errors=all
  when: not kubeadmin_conf.stat.exists

- name: Cấu hình thư mục .kube cho user ubuntu và root
  shell: |
    mkdir -p /home/ubuntu/.kube /root/.kube
    cp -f /etc/kubernetes/admin.conf /home/ubuntu/.kube/config
    cp -f /etc/kubernetes/admin.conf /root/.kube/config
    chown -R ubuntu:ubuntu /home/ubuntu/.kube
  changed_when: false

- name: Cài đặt Flannel CNI (Mạng Pod nhẹ cho cụm)
  shell: |
    KUBECONFIG=/etc/kubernetes/admin.conf kubectl apply -f {{ flannel_manifest_url }}
  changed_when: false

- name: Đợi Control-Plane Node sẵn sàng (Ready)
  shell: |
    KUBECONFIG=/etc/kubernetes/admin.conf kubectl get nodes | grep 'Ready'
  register: node_ready
  until: node_ready.rc == 0
  retries: 25
  delay: 5
  changed_when: false

- name: Tạo lệnh join token mới cho Worker nodes
  command: kubeadm token create --print-join-command
  register: join_cmd_raw
  changed_when: false

- name: Lưu lệnh join vào hostvars cho các Worker nodes sử dụng
  set_fact:
    k8s_join_command: "{{ join_cmd_raw.stdout }} --ignore-preflight-errors=all"

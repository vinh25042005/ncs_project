---
# Role: common — Cấu hình OS, containerd và cài đặt kubeadm/kubelet/kubectl
# Áp dụng cho toàn bộ các node trong cụm 
- name: Đợi và giải phóng tiến trình unattended-upgrades nếu có
  shell: |
    systemctl stop unattended-upgrades 2>/dev/null || true
    while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
      echo "Đang đợi tiến trình APT khác hoàn tất..."
      sleep 3
    done
    dpkg --configure -a
  changed_when: false
  ignore_errors: true

- name: Nạp kernel modules cho Kubernetes và containerd
  copy:
    src: k8s-modules.conf
    dest: /etc/modules-load.d/k8s.conf
    mode: '0644'

- name: Kích hoạt kernel modules
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Cấu hình sysctl cho mạng Kubernetes
  copy:
    src: 99-kubernetes.conf
    dest: /etc/sysctl.d/99-kubernetes.conf
    mode: '0644'

- name: Áp dụng sysctl
  command: sysctl --system
  changed_when: false

- name: Tắt Swap hoàn toàn theo chuẩn Kubernetes
  shell: |
    swapoff -a
    sed -i '/swap/d' /etc/fstab
    rm -f /swapfile
  changed_when: false

- name: Cài đặt các gói phụ trợ cơ bản
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - jq
      - conntrack
      - socat
    state: present
    update_cache: yes

- name: Cài đặt Containerd
  apt:
    name: containerd
    state: present

- name: Tạo cấu hình containerd nếu chưa tồn tại
  shell: |
    mkdir -p /etc/containerd
    containerd config default > /etc/containerd/config.toml
    sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
    sed -i 's|sandbox_image = .*|sandbox_image = "registry.k8s.io/pause:3.10"|' /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml
  notify: restart containerd

- name: Đảm bảo dịch vụ containerd được bật và chạy
  systemd:
    name: containerd
    state: started
    enabled: yes

- name: Tạo thư mục chứa keyring Kubernetes
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Tải GPG Key của kho Kubernetes v{{ k8s_version }}
  shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg --yes
  changed_when: false

- name: Thêm kho apt của Kubernetes
  template:
    src: kubernetes.list.j2
    dest: /etc/apt/sources.list.d/kubernetes.list
    mode: '0644'

- name: Cập nhật apt cache và cài đặt kubelet, kubeadm, kubectl
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: yes

- name: Khóa phiên bản kubelet, kubeadm, kubectl
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Đảm bảo dịch vụ kubelet được bật
  systemd:
    name: kubelet
    enabled: yes

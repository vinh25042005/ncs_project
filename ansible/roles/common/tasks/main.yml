---
# Role: common — Cấu hình OS, containerd, swap đệm và cài đặt kubeadm/kubelet/kubectl
# Áp dụng cho toàn bộ các node trong cụm 
- name: Đợi và giải phóng tiến trình apt lock nếu có
  shell: |
    systemctl stop unattended-upgrades 2>/dev/null || true
    killall -9 apt-get 2>/dev/null || true
    killall -9 apt 2>/dev/null || true
    rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock
    dpkg --configure -a
  changed_when: false
  ignore_errors: true

- name: Nạp kernel modules cho Kubernetes và containerd
  copy:
    src: k8s-modules.conf
    dest: /etc/modules-load.d/k8s.conf
    mode: '0644'

- name: Kích hoạt kernel modules
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Cấu hình sysctl cho mạng Kubernetes
  copy:
    src: 99-kubernetes.conf
    dest: /etc/sysctl.d/99-kubernetes.conf
    mode: '0644'

- name: Áp dụng sysctl
  command: sysctl --system
  changed_when: false

- name: Cấu hình 2GB Swapfile 
  shell: |
    if [ ! -f /swapfile ]; then
      fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      echo '/swapfile none swap sw 0 0' >> /etc/fstab
    fi
  changed_when: false

- name: Cài đặt các gói phụ trợ cơ bản
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - jq
      - conntrack
      - socat
    state: present
    update_cache: yes

- name: Cài đặt Containerd
  apt:
    name: containerd
    state: present

- name: Cấu hình containerd với SystemdCgroup = true và pause:3.10
  shell: |
    mkdir -p /etc/containerd
    containerd config default > /etc/containerd/config.toml
    sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
    sed -i 's|sandbox_image = .*|sandbox_image = "registry.k8s.io/pause:3.10"|' /etc/containerd/config.toml
    systemctl restart containerd
    systemctl enable containerd
  changed_when: true

- name: Tạo thư mục chứa keyring Kubernetes
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Tải GPG Key của kho Kubernetes v{{ k8s_version }}
  shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg --yes
  changed_when: false

- name: Thêm kho apt của Kubernetes
  template:
    src: kubernetes.list.j2
    dest: /etc/apt/sources.list.d/kubernetes.list
    mode: '0644'

- name: Cập nhật apt cache và cài đặt kubelet, kubeadm, kubectl
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: yes

- name: Khóa phiên bản kubelet, kubeadm, kubectl
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: "Cấu hình Kubelet cho phép Swap"
  copy:
    src: kubelet
    dest: /etc/default/kubelet
    mode: '0644'
  notify: restart kubelet

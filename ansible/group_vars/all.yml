---
# Global variables for NCS Project Kubernetes Cluster (Kubeadm)

k8s_version: "1.31"
pod_network_cidr: "10.244.0.0/16"
master_ip: "10.0.10.10"
flannel_manifest_url: "https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml"
ingress_nginx_manifest_url: "https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/baremetal/deploy.yaml"

# Giới hạn K8s Audit Log trên kube-apiserver (tránh đầy đĩa Master)
# Mỗi file tối đa audit_log_maxsize MB; giữ tối đa audit_log_maxbackup file cũ; xóa file cũ hơn audit_log_maxage ngày
audit_log_maxsize: 100
audit_log_maxbackup: 10
audit_log_maxage: 7

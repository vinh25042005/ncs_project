---
# Playbook: site.yml — Triển khai tự động toàn diện hệ thống an ninh & cụm K8s
# NCS Project: pfSense/Linux Gateway Suricata IDS/IPS + Upstream K8s v1.31 + Metrics-Server + Online Boutique
# ==========================================================================================================

# Giai đoạn 1: Cấu hình Gateway và kích hoạt Suricata IDS/IPS
- name: Giai đoạn 1 - Tự động hóa cấu hình Gateway & Suricata IDS/IPS
  hosts: gateway
  become: yes
  tags: [gateway]
  roles:
    - gateway

# Giai đoạn 2: Chuẩn bị OS, containerd và cài kubeadm/kubelet/kubectl trên mọi node
- name: Giai đoạn 2 - Cấu hình nền tảng trên toàn bộ các node (Common Prerequisites)
  hosts: k8s_cluster
  become: yes
  tags: [common]
  roles:
    - common

# Giai đoạn 3: Khởi tạo Control-Plane Master node và cài Flannel CNI
- name: Giai đoạn 3 - Khởi tạo Kubernetes Control-Plane (kubeadm init)
  hosts: master
  become: yes
  tags: [master]
  roles:
    - master

# Giai đoạn 4: Tham gia các Worker node vào cụm (Multi-AZ)
- name: Giai đoạn 4 - Kết nối Worker nodes vào cụm (kubeadm join)
  hosts: workers
  become: yes
  tags: [worker, workers]
  roles:
    - worker

# Giai đoạn 5: Cài đặt Ingress-NGINX Bare-metal HostNetwork trên Master
- name: Giai đoạn 5 - Triển khai Ingress-NGINX Controller
  hosts: master
  become: yes
  tags: [ingress]
  roles:
    - ingress

# Giai đoạn 6: Cài đặt Metrics-Server cho cụm K8s (phục vụ HPA và kubectl top)
- name: Giai đoạn 6 - Triển khai Metrics-Server cho HPA Autoscaling
  hosts: master
  become: yes
  tags: [metrics, metrics_server]
  roles:
    - metrics_server

# Giai đoạn 7: Cài đặt Kubernetes Dashboard Web UI
- name: Giai đoạn 7 - Triển khai Kubernetes Dashboard Web UI
  hosts: master
  become: yes
  tags: [dashboard, kubernetes_dashboard]
  roles:
    - kubernetes_dashboard

# Giai đoạn 7.5: Cài bộ thi hành NetworkPolicy (kube-network-policies) cho cụm Flannel
- name: Giai đoạn 7.5 - Cài bộ thi hành NetworkPolicy
  hosts: master
  become: yes
  tags: [netpol, netpol_enforcer]
  roles:
    - netpol_enforcer

# Giai đoạn 8: Triển khai các microservices của Google Online Boutique từ thư mục k8s/
- name: Giai đoạn 8 - Triển khai Google Online Boutique và Network Policies
  hosts: master
  become: yes
  tags: [app, online_boutique, netpol]
  roles:
    - online_boutique

# Giai đoạn 9: Wazuh Manager trên máy chủ SIEM chuyên biệt (Management Subnet 10.0.20.10)
- name: Giai đoạn 9 - Wazuh Manager trên máy chủ SIEM chuyên biệt
  hosts: wazuh
  become: yes
  tags: [wazuh, wazuh_manager]
  roles:
    - wazuh_manager

# Giai đoạn 10: Wazuh Agent trên các Gateway (đẩy log Suricata eve.json)
- name: Giai đoạn 10 - Wazuh Agent trên Gateway (Suricata eve.json)
  hosts: gateway
  become: yes
  tags: [wazuh, wazuh_agent]
  vars:
    wazuh_agent_suricata: true
  roles:
    - wazuh_agent

# Giai đoạn 10.5: Wazuh Agent trên K8s Master (đẩy K8s audit.log)
- name: Giai đoạn 10.5 - Wazuh Agent trên Master (K8s audit log)
  hosts: master
  become: yes
  tags: [wazuh, wazuh_agent]
  vars:
    wazuh_agent_k8s_audit: true
  roles:
    - wazuh_agent

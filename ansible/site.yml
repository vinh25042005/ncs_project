---
# Playbook: site.yml — Triển khai tự động toàn diện hệ thống an ninh & cụm K8s
# NCS Project: pfSense/Linux Gateway Suricata IDS/IPS + Upstream K8s v1.31 + Metrics-Server + Online Boutique
# ==========================================================================================================

# Giai đoạn 1: Cấu hình Gateway và kích hoạt Suricata IDS/IPS
- name: Giai đoạn 1 - Tự động hóa cấu hình Gateway & Suricata IDS/IPS
  hosts: gateway
  become: yes
  roles:
    - gateway

# Giai đoạn 2: Chuẩn bị OS, containerd, swap đệm và cài kubeadm/kubelet/kubectl trên mọi node
- name: Giai đoạn 2 - Cấu hình nền tảng trên toàn bộ các node (Common Prerequisites)
  hosts: k8s_cluster
  become: yes
  roles:
    - common

# Giai đoạn 3: Khởi tạo Control-Plane Master node và cài Flannel CNI
- name: Giai đoạn 3 - Khởi tạo Kubernetes Control-Plane (kubeadm init)
  hosts: master
  become: yes
  roles:
    - master

# Giai đoạn 4: Tham gia các Worker node vào cụm (Multi-AZ)
- name: Giai đoạn 4 - Kết nối Worker nodes vào cụm (kubeadm join)
  hosts: workers
  become: yes
  roles:
    - worker

# Giai đoạn 5: Cài đặt Ingress-NGINX Bare-metal HostNetwork trên Master
- name: Giai đoạn 5 - Triển khai Ingress-NGINX Controller
  hosts: master
  become: yes
  roles:
    - ingress

# Giai đoạn 6: Cài đặt Metrics-Server cho cụm K8s (phục vụ HPA và kubectl top)
- name: Giai đoạn 6 - Triển khai Metrics-Server cho HPA Autoscaling
  hosts: master
  become: yes
  roles:
    - metrics_server

# Giai đoạn 7: Cài đặt Kubernetes Dashboard Web UI
- name: Giai đoạn 7 - Triển khai Kubernetes Dashboard Web UI
  hosts: master
  become: yes
  roles:
    - kubernetes_dashboard

# Giai đoạn 8: Triển khai 12 microservices của Google Online Boutique từ thư mục k8s/
- name: Giai đoạn 8 - Triển khai Google Online Boutique và Network Policies
  hosts: master
  become: yes
  roles:
    - online_boutique

apiVersion: v1
kind: ResourceQuota
metadata:
  name: online-boutique-quota
  namespace: online-boutique
spec:
  hard:
    requests.cpu: "2.8"
    requests.memory: 2.2Gi
    limits.cpu: "5"
    limits.memory: 3.5Gi
    pods: "25"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: online-boutique-limits
  namespace: online-boutique
spec:
  limits:
    - default:
        cpu: 300m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1Gi
      min:
        cpu: 10m
        memory: 16Mi
      type: Container
